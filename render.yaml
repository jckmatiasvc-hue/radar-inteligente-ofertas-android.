services:
  - type: web
    name: radar-inteligente-ofertas-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: MIN_DROP_PERCENT
        value: "15"
